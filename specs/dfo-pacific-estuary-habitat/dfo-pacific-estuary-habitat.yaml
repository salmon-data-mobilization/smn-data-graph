spec_version: 1
slug: dfo-pacific-estuary-habitat
version: lexical-b1c5095222d9
title: Pacific estuaries, salmon habitat and human activities
description: The two English tables describe ecological attributes and human activities at 439 estuaries across the Pacific Region. The ecological file includes salmon biomass, salmon species richness and a Conservation Unit field. The activity file contains salmon gillnet, seine and troll fishery fields alongside other pressures.
source:
  publisher: Fisheries and Oceans Canada
  landing_page: https://open.canada.ca/data/en/dataset/e2a6cfd7-64a3-4588-beb2-aa9c63adc9f4
  licence: https://open.canada.ca/en/open-government-licence-canada
  redistribution: confirmed
  attribution: Contains information licensed under the Open Government Licence – Canada. Fisheries and Oceans Canada, Coastwide Evaluation and Classification of Pacific Region Estuaries based on Anthropogenic Activities and Significant Fish Habitat, Open Government Portal record e2a6cfd7-64a3-4588-beb2-aa9c63adc9f4. This package preserves the selected source records and adds structural metadata.
