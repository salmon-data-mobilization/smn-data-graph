  landing_page: https://github.com/nwfsc-math-bio/VRData/blob/1511807c895c5adfd1b146a92023a9f93bffde31/data-raw/ICSRSSchinookModel.csv
  licence: null
  redistribution: unconfirmed
  attribution: NOAA Northwest Fisheries Science Center, VRData 2.3 (April 21, 2022). The Nez Perce Tribe contributed the estimates and Mari Williams compiled the source table. https://github.com/nwfsc-math-bio/VRData/blob/1511807c895c5adfd1b146a92023a9f93bffde31/data-raw/ICSRSSchinookModel.csv. NOAA declares CC0 1.0 for its VRData package (https://creativecommons.org/publicdomain/zero/1.0/). The table documentation identifies the Nez Perce Tribe as the data contributor and supplies no separate redistribution statement for that series. The derived package adds structural metadata and serializes the original table with source values preserved.
