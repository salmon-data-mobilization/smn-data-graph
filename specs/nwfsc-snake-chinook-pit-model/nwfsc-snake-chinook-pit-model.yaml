title: Snake River spring/summer Chinook salmon spawner estimates from PIT detections
description: '[agent] The complete ICSRSSchinookModel.csv table from NOAA Northwest Fisheries Science Center VRData 2.3 contains 159 population-year estimates in 20 Snake River spring/summer Chinook populations for years within 2010–2019. The Nez Perce Tribe contributed the series. VRData identifies the method as DABOM model expansion of PIT-tag detections. The package preserves all 19 source fields as text.'
source:
