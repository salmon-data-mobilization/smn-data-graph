title: Methow River floodplain fish biomass and production
description: '[agent] The Methow River food-web study compared fish abundance, biomass and production across sampling sites and study years. This package covers the complete fish biomass and production worksheet, including species alongside salmon and steelhead. Repeated 95% interval headers retain their original column positions. The two diet and invertebrate workbooks remain in the deposit.'
