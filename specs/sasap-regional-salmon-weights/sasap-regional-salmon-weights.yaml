title: "Regional salmon weight derived from commercial catch data, Alaska, 1975-2016"
description: "[agent] Tobias Schwoerer used commercial landings to derive weight estimates in pounds by year, SASAP region and species. The weight table includes the median and two quantiles. Two lookup tables describe the geographic groupings."
