parser: csv
tables:
  - id: weights
    file: weights.csv
    keys: ["Species", "SASAP.Region", "YEAR"]
    columns:
      - {name: "Species", role: attribute, datatype: string, description: "salmon species"}
      - {name: "SASAP.Region", role: attribute, datatype: string, description: "SASAP region of harvest"}
      - {name: "YEAR", role: attribute, datatype: string, description: "Year of harvest"}
      - {name: "median_wgt", role: attribute, datatype: string, description: "median weight in pounds of harvested salmon, derived by dividing the net weight of the harvest by the number of fish"}
      - {name: "p05_wgt", role: attribute, datatype: string, description: "5% probability quantile of weight"}
      - {name: "p95_wgt", role: attribute, datatype: string, description: "95% probability quantile of weight"}
  - id: district_regions
    file: district_region_lut.csv
    keys: ["District"]
    columns:
      - {name: "SASAP.Region", role: attribute, datatype: string, description: "SASAP region in which district is located"}
      - {name: "District", role: attribute, datatype: string, description: "ADF&G commercial fishing district number"}
  - id: harvest_regions
    file: harvest_regions.csv
    keys: ["ADFG_Area"]
    columns:
      - {name: "ADFG_Area", role: attribute, datatype: string, description: "ADF&G commercial fishing area"}
      - {name: "SASAPRegions", role: attribute, datatype: string, description: "Corresponding SASAP region"}
