  - name: ExpFactor1
    role: attribute
    datatype: string
    description: Expansion for missing estimates at indicator streams.
  - name: AdjSum
    role: attribute
    datatype: string
    description: Sum of reported indicator-stream escapements after adjustment for missing values.
  - name: ExpFactor2
    role: attribute
    datatype: string
    description: Expansion for escapement at streams outside the indicator set.
  - name: ObsE
    role: attribute
    datatype: string
    description: Estimate of total observed escapement across streams in a Conservation Unit.
  - name: ExpFactor3
    role: attribute
    datatype: string
    description: Expansion for observer efficiency in the northern and central coast estimates.
  - name: unnamed_source_column_60
    role: attribute
    datatype: string
    description: Package alias for the unnamed 60th CSV column. All source values are empty.
  - name: unnamed_source_column_61
    role: attribute
    datatype: string
    description: Package alias for the unnamed 61st CSV column. All source values are empty.
  - name: source_columns_with_trailing_space
    role: attribute
    datatype: string
    description: Reconstruction metadata. Each entry is a one-based column position in the original publisher CSV. Split multiple positions on |. Append one ASCII space (U+0020) to the source value at each listed position. An empty entry means no spaces were separated. Source positions exclude package-added columns.
- id: series_summary
  file: Salmon_RS_Time_Series_Summary.csv
  keys:
  - source_record_number
  columns:
  - name: source_record_number
    role: attribute
    datatype: string
    description: Derived one-based record position after the header in the time-series summary CSV. This package key identifies a location in the pinned file.
  - name: Species
    role: attribute
    datatype: string
    description: Source species or pink salmon brood-line label.
  - name: Area
    role: attribute
    datatype: string
    description: Area of British Columbia.
  - name: Area unit
    role: attribute
    datatype: string
    description: Geographic or biological unit covered by the series.
  - name: CU or PFMA
    role: attribute
    datatype: string
    description: Source name for a Conservation Unit or fishery management area, when available.
  - name: CU type
    role: attribute
    datatype: string
    description: Conservation Unit category used in the DFO compilation.
  - name: Data source
    role: attribute
    datatype: string
    description: Source for the numerical data.
  - name: R/S first year
    role: attribute
    datatype: string
    description: First brood year with a reported recruits-per-spawner value.
  - name: R/S last year
    role: attribute
    datatype: string
    description: Last brood year with a reported recruits-per-spawner value.
  - name: R/S missing
    role: attribute
    datatype: string
    description: Missing brood years inside the stated recruits-per-spawner period.
  - name: Total years
    role: attribute
    datatype: string
    description: The dictionary describes this as the number of missing years in the reported range. Values are preserved as given.
  - name: SQmean
    role: attribute
    datatype: string
    description: Mean escapement-data quality over the return years included by DFO.
  - name: CQmean
    role: attribute
    datatype: string
    description: Mean catch-data quality over the return years included by DFO.
  - name: AQmean
    role: attribute
    datatype: string
    description: Mean age-data quality over the return years included by DFO.
  - name: RQmean
    role: attribute
    datatype: string
    description: Mean quality rating for the recruits-per-spawner series.
  - name: Data quality (Grant & Pestal 2012, p.35)
    role: attribute
    datatype: string
    description: Spawner enumeration quality category from Grant and Pestal, as reported by DFO.
  - name: Source of comments
    role: attribute
    datatype: string
    description: Origin of the summary comments.
  - name: Perct.streams
    role: attribute
    datatype: string
    description: Indicator-stream coverage category. Some labels abbreviate percentage ranges.
  - name: Escapement (comments)
    role: attribute
    datatype: string
    description: Source notes on escapement estimates.
  - name: Return (comments)
    role: attribute
    datatype: string
    description: Source notes on total return estimates.
  - name: Age structure (comments)
    role: attribute
    datatype: string
    description: Source notes on age structure.
  - name: Recruitment (comments)
    role: attribute
    datatype: string
    description: Source notes on recruitment estimates.
  - name: Exploitation rate (comments)
    role: attribute
    datatype: string
    description: Source notes on exploitation-rate estimates.
  - name: Catch (comments)
    role: attribute
    datatype: string
    description: Source notes on catch estimation.
  - name: Stock, general (comments)
    role: attribute
    datatype: string
    description: Source notes on the stock and its productivity.
  - name: PFMA where CU caught
    role: attribute
    datatype: string
    description: Fishery management area of catch for northern and central coast Conservation Units, where reported.
  - name: source_columns_with_trailing_space
    role: attribute
    datatype: string
    description: Reconstruction metadata. Each entry is a one-based column position in the original publisher CSV. Split multiple positions on |. Append one ASCII space (U+0020) to the source value at each listed position. An empty entry means no spaces were separated. Source positions exclude package-added columns.
