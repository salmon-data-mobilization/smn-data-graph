spec_version: 1
slug: dfo-rs-productivity
version: lexical-418508415cb5
title: 'British Columbia sockeye, pink and chum salmon productivity: annual data, time-series summaries and decadal data quality'
description: DFO annual productivity, time-series summaries and decadal data-quality summaries. Every input record can be reconstructed from these lexical tables. One terminal space in each of 77 comment cells is stored by its original column position, because the SDK trims resource strings on read. Two unnamed annual headers receive positional aliases, the series summary gains a source-record key and each decadal species or brood-line block keeps its own header. The graph describes tables, columns and provenance.
source:
  publisher: Fisheries and Oceans Canada
  landing_page: https://open.canada.ca/data/en/dataset/3d659575-4125-44b4-8d8f-c050d6624758
  licence: https://open.canada.ca/en/open-government-licence-canada
  redistribution: confirmed
  attribution: 'Contains information licensed under the Open Government Licence – Canada. Source: Fisheries and Oceans Canada, Productivity (Recruits-per-Spawner) data for Sockeye, Pink, and Chum Salmon from British Columbia, Open Government Portal record 3d659575-4125-44b4-8d8f-c050d6624758. Methods: Ogden et al. (2015), Canadian Technical Report of Fisheries and Aquatic Sciences 3130. This derived package assigns two reversible positional column names and a summary record key. The decadal source file is packaged as four blocks under their original headers. Empty padding to the right of each block is removed. The annual and series-summary tables carry a reconstruction column identifying 77 comment cells from which one trailing space was separated.'
  files:
  - name: Salmon_RS_Database.csv
    url: https://api-proxy.edh-cde.dfo-mpo.gc.ca/catalogue/records/3d659575-4125-44b4-8d8f-c050d6624758/attachments/Salmon_RS_Database.csv
