title: South Coast BC Chinook Reference Fishery biological samples
description: The English resource for each of 2023, 2024 and 2025 records fish sampled in the Chinook Reference Fishery. Rows include date, creel sub-area, fin-clip status, length, size class, stock-region assignment and ranked alternatives with probabilities. The three distinct files retain the date formats used in each source.
