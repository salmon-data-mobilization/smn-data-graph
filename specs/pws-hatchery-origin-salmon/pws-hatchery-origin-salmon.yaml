parser: csv
tables:
  - id: pink_stream_proportions
    file: pink-stream-proportions.csv
    keys: ["ADFGStreamCode", "SurveyDate"]
    columns:
      - {name: "ADFGStreamCode", role: attribute, datatype: string, description: "Unique Alaska Department of Fish and Game stream identifier."}
      - {name: "StreamName", role: attribute, datatype: string, description: "Name of study stream."}
      - {name: "Region", role: attribute, datatype: string, description: "Region of Alaska. PWS = Prince William Sound."}
      - {name: "SurveyDate", role: attribute, datatype: string, description: "Date of stream survey."}
      - {name: "SurveyYear", role: attribute, datatype: string, description: "Year of stream survey."}
      - {name: "SurveyJulienDate", role: attribute, datatype: string, description: "Julien date of stream survey."}
      - {name: "SpeciesCode", role: attribute, datatype: string, description: "Unique Alaska Department of Fish and Game species code. 440 = Pink Salmon."}
      - {name: "CommonName", role: attribute, datatype: string, description: "Common name of study species."}
      - {name: "AliveCount", role: attribute, datatype: string, description: "Number of alive Pink Salmon estimated in and around the stream reach during each day's survey."}
      - {name: "DeadCount", role: attribute, datatype: string, description: "Number of dead Pink Salmon estimated in and around the stream reach during each day's survey."}
      - {name: "NumberSpecimens", role: attribute, datatype: string, description: "Number of individual Pink Salmon examined for sex, length, and otolith removal."}
      - {name: "NumberReadOK", role: attribute, datatype: string, description: "Number of otolith specimens read successfully (OK) to determine natural or hatchery origin."}
      - {name: "NumberMarked", role: attribute, datatype: string, description: "Number of successfully read otolith specimens determined to be of hatchery origin."}
      - {name: "NumberUnmarked", role: attribute, datatype: string, description: "Number of successfully read otolith specimens determined to be of natural origin."}
      - {name: "PercentStrays", role: attribute, datatype: string, description: "Percentage of the number of otolith specimens read successfully (OK) determined to be of hatchery origin."}
  - id: chum_stream_proportions
    file: chum-stream-proportions.csv
    keys: ["ADFGStreamCode", "SurveyDate"]
    columns:
      - {name: "ADFGStreamCode", role: attribute, datatype: string, description: "Unique Alaska Department of Fish and Game stream identifier. See Alaska Department of Fish and Game's Anadromous Waters Catalog."}
      - {name: "StreamName", role: attribute, datatype: string, description: "Name of study stream."}
      - {name: "Region", role: attribute, datatype: string, description: "Region of Alaska. PWS = Prince William Sound."}
      - {name: "SurveyDate", role: attribute, datatype: string, description: "Date of stream survey."}
      - {name: "SurveyYear", role: attribute, datatype: string, description: "Year of stream survey."}
      - {name: "SurveyJulienDate", role: attribute, datatype: string, description: "Julien date of stream survey."}
      - {name: "SpeciesCode", role: attribute, datatype: string, description: "Unique Alaska Department of Fish and Game species code. 450 = Chum Salmon."}
      - {name: "CommonName", role: attribute, datatype: string, description: "Common name of study species."}
      - {name: "AliveCount", role: attribute, datatype: string, description: "Number of alive Chum Salmon estimated in and around the stream reach during each day's survey."}
      - {name: "DeadCount", role: attribute, datatype: string, description: "Number of dead Chum Salmon estimated in and around the stream reach during each day's survey."}
      - {name: "NumberSpecimens", role: attribute, datatype: string, description: "Number of individual Chum Salmon examined for sex, length, and otolith removal."}
      - {name: "NumberReadOK", role: attribute, datatype: string, description: "Number of otolith specimens read successfully (OK) to determine natural or hatchery origin."}
      - {name: "NumberMarked", role: attribute, datatype: string, description: "Number of successfully read otolith specimens determined to be of hatchery origin."}
      - {name: "NumberUnmarked", role: attribute, datatype: string, description: "Number of successfully read otolith specimens determined to be of natural origin."}
      - {name: "PercentStrays", role: attribute, datatype: string, description: "Percentage of the number of otolith specimens read successfully (OK) determined to be of hatchery origin."}
