title: "Hatchery-origin stray rates and total run characteristics for Pink Salmon and Chum Salmon returning to Prince William Sound, Alaska in 2013-2015"
description: "[agent] Two stream-survey files record the sampling behind the estimates of hatchery-origin pink and chum salmon in 2013–2015. Each survey retains stream identifiers, specimen counts, marked and unmarked counts and the reported percentage of strays."
source:
  publisher: "KNB Data Repository"
  doi: 10.5063/F1QV3JXF
  landing_page: https://knb.ecoinformatics.org/view/doi:10.5063/F1QV3JXF
  licence: https://creativecommons.org/licenses/by/4.0/
  redistribution: confirmed
  attribution: "E. Eric Knudsen, Peter S. Rand, Kristen B. Gorman, David R. Bernard, William D. Templin (2020). Hatchery-origin stray rates and total run characteristics for Pink Salmon and Chum Salmon returning to Prince William Sound, Alaska in 2013-2015. KNB Data Repository. https://doi.org/10.5063/F1QV3JXF. CC BY 4.0, https://creativecommons.org/licenses/by/4.0/. Published CSVs are reserialized locally with structural graph metadata."
  files:
    - name: metadata.xml
      url: https://cn.dataone.org/cn/v2/resolve/doi:10.5063/F1QV3JXF
