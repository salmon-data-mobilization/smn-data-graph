parser: specs.knb_lexical_csv:parse
tables:
  - id: determinations
    file: fishery_disaster_request_details.csv
    keys: ["ShortName"]
    columns:
      - {name: "ShortName", role: attribute, datatype: string, description: "Short name of disaster roughly corresponding to title on NOAA fishery disaster webpage"}
      - {name: "Amount", role: attribute, datatype: string, description: "Amount of money (in unadjusted USD) that was appropriated for disaster, if a disaster was declared"}
      - {name: "Area", role: attribute, datatype: string, description: "Areas affected by fishery, corresponding to \"Fishery/Area Affected\" on NOAA fishery disaster website"}
      - {name: "Date_Determination", role: attribute, datatype: string, description: "Date of disaster determination (where available)"}
      - {name: "Date_Request", role: attribute, datatype: string, description: "Date of disaster request"}
      - {name: "Funding_Distribution", role: attribute, datatype: string, description: "Detailed information on how funding was distributed (where available)"}
      - {name: "Requester", role: attribute, datatype: string, description: "Source column Requester."}
      - {name: "Source", role: attribute, datatype: string, description: "Additional source information for disaster declaration (where available)"}
      - {name: "Species", role: attribute, datatype: string, description: "Species of Pacific Salmon affected by disaster"}
      - {name: "Status", role: attribute, datatype: string, description: "Source column Status."}
      - {name: "Comments", role: attribute, datatype: string, description: "Additional comments on disaster declaration"}
      - {name: "source_cell_padding", role: attribute, datatype: string, description: "Derived JSON triples of original column position, leading whitespace and trailing whitespace. An empty value means no padding."}
  - id: areas
    file: fishery_disaster_requests_by_area.csv
    keys: ["SASAP_Region"]
    columns:
      - {name: "SASAP_Region", role: attribute, datatype: string, description: "Region of Alaska directly affected by disaster"}
      - {name: "Count", role: attribute, datatype: string, description: "Number of disaster declarations"}
      - {name: "Year", role: attribute, datatype: string, description: "Source column Year."}
