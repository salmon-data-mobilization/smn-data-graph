description: '[agent] Juvenile fall-run Chinook from Coleman National Fish Hatchery in California were studied under different water temperatures. This package covers the fish-level source table with lengths, body and meal weights, temperature and experimental fields. Individual metabolism traces and R code remain in the record. The study methods are available in the associated paper.'
