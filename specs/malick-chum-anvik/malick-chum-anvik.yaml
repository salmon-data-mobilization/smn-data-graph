spec_version: 1
slug: malick-chum-anvik
version: v1.1
title: Malick Anvik native source records (stock.id349), lexical discovery
description: '[agent] Derived source-discovery slice of Malick pink-chum-database
  v1.1 (Zenodo6478751), preserving all 22 native stock349 rows/16 fields plus native
  information/source links16,18. Every field remains lexical text. No observations,
  identity mappings, age convention, biological semantics or scientific acceptance
  is admitted. Measured intake remains blocked by unresolved formal age notation and
  the current age-name gate.'
source:
  publisher: Michael Malick
  landing_page: https://zenodo.org/records/6478751
  doi: 10.5281/zenodo.6478751
  licence: https://creativecommons.org/publicdomain/zero/1.0/
  redistribution: confirmed
  attribution: Michael Malick (2022). pink-chum-database, v1.1. Zenodo. DOI10.5281/zenodo.6478751.
    CC0 is explicit in deposit metadata and included LICENSE. This Anvik source-local
    slice is derived, not a new publisher release; native source providers/publications
    remain in chum_sources.
  files:
  - name: pink-chum-database-1.1.zip
    url: https://zenodo.org/api/records/6478751/files/pink-chum-database-1.1.zip/content
    sha256: 1428be29011afff2fb17bac694aefe7998a2b5188f23b771be17de7643cfc9b5
parser: specs.malick_anvik_parser:parse
tables:
