  - stock.id
  - brood.yr
  columns:
  - name: stock.id
    role: attribute
    datatype: string
    label: stock.id
    description: 'Source README: unique stock identifier linking the source files.
      [agent] Retained as a source-local text key; no cross-dataset identity.'
  - name: species
    role: attribute
    datatype: string
    label: species
    description: 'Source README: species of salmon. [agent] Original source text;
      no taxonomic class mapping.'
  - name: stock
    role: attribute
    datatype: string
    label: stock
    description: 'Source README: name of the salmon stock. [agent] Source label only.'
  - name: region
    role: attribute
    datatype: string
    label: region
    description: 'Source README: geographic region in the source compilation. [agent]
      Original source text; no geographic equivalence.'
  - name: sub.region
    role: attribute
    datatype: string
    label: sub.region
    description: 'Source README: geographic sub-region, species-specific. [agent]
      Original source text.'
  - name: brood.yr
    role: attribute
    datatype: string
    label: brood.yr
    description: 'Source README: brood year, the year spawners were enumerated on
      their way to spawning grounds. [agent] Retained as original text; no year-basis
      RDF binding.'
  - name: spawners
    role: attribute
    datatype: string
    label: spawners
    description: 'Source README: total spawners for the brood year, in number of salmon.
      [agent] Retained as original numeric text, without an ontology measure/unit
      mapping.'
  - name: recruits
    role: attribute
    datatype: string
    label: recruits
    description: 'Source README: total recruitment resulting from the brood-year spawners;
      for chum, sum of recruit-age columns. [agent] Retained as original text; no
      recomputation or completeness claim.'
  - name: use
    role: attribute
    datatype: string
    label: use
    description: 'Source README: 1 identifies author-usable points; blank means excluded
      from analyses. [agent] Source flag retained verbatim; no filtering or scientific
      acceptance.'
  - name: recruits.2
    role: attribute
    datatype: string
    label: recruits.2
    description: 'Source README: number of recruits returning at age 2. [agent] Original
