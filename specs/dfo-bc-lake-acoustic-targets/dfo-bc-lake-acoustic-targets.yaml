slug: dfo-bc-lake-acoustic-targets
version: lexical-7a1805f167b1
title: BC lake acoustic surveys and Great Central Lake target records
description: The output archive contains a survey inventory and detailed acoustic-target records. This package takes the complete inventory and all detailed records whose original lake code is 1 (Great Central Lk). It keeps the publisher’s lake, transect, depth, target, species-proportion and data-issue fields.
source:
