  licence: https://open.canada.ca/en/open-government-licence-canada
  redistribution: confirmed
  attribution: Contains information licensed under the Open Government Licence – Canada. Fisheries and Oceans Canada, Acoustic Target Data in British Columbia Lakes, Open Government Portal record 5b5d3312-12e6-4265-b07b-c69dcc17a566. This package preserves the selected source records and adds structural metadata.
