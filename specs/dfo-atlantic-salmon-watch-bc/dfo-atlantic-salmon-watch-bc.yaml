title: Atlantic salmon reported in British Columbia waters
description: The English Atlantic Salmon Watch Program file comprises 117 reports. DFO verified 79 reports as Atlantic salmon and recorded 38 as unconfirmed by a “No” flag. The source distinguishes these categories. Pairs of reports can share a date and location. The file ends with 25 empty export records, which are checked separately and omitted from the report count.
