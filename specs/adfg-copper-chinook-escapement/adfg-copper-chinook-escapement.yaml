    columns:
      - {name: "Year", role: attribute, datatype: string, description: "The year the data was sampled"}
      - {name: "Copper_District_Commercial_Harvest", role: attribute, datatype: string, description: "Copper District, Commercial Harvest"}
      - {name: "Copper_District_Subsistence_Harvest", role: attribute, datatype: string, description: "Copper District, Subsistence Harvest"}
      - {name: "Copper_District_Homepack_Harvest", role: attribute, datatype: string, description: "Copper District, Homepack Harvest"}
      - {name: "Copper_District_Donated_Harvest", role: attribute, datatype: string, description: "Copper District, Donated Harvest"}
      - {name: "Copper_District_Educational_Harvest", role: attribute, datatype: string, description: "Copper District, Educational Harvest"}
      - {name: "Copper_District_District_Total_Harvest", role: attribute, datatype: string, description: "Copper District, Total Harvest. The sum of commercial, subsistence, homepack, donated, and educational harvest for Copper District."}
      - {name: "Chitina_Subdistrict_Harvest_State", role: attribute, datatype: string, description: "Chitina Subdistrict, State Harvest"}
      - {name: "Chitina_Subdistrict_Harvest_Federal", role: attribute, datatype: string, description: "Chitina Subdistrict, Federal Harvest"}
      - {name: "Chitina_Subdistrict_Harvest_Total", role: attribute, datatype: string, description: "Chitina Subdistrict, Total Harvest. The sum of state and federal harvest for Chitina Subdistrict."}
      - {name: "Chitina_Subdistrict_Harvest_SE", role: attribute, datatype: string, description: "Chitina Subdistrict, Harvest Standard Error"}
      - {name: "Chitina_Subdistrict_Harvest_CV", role: attribute, datatype: string, description: "Chitina Subdistrict, Harvest Coefficient of Variation. Calculated by dividing the Standard Error by the Total Harvest."}
      - {name: "Glennallen_Subdistrict_Harvest_State", role: attribute, datatype: string, description: "Glennallen Subdistrict, State Harvest"}
      - {name: "Glennallen_Subdistrict_Harvest_Federal", role: attribute, datatype: string, description: "Glennallen Subdistrict, Federal Harvest"}
      - {name: "Glennallen_Subdistrict_Harvest_Total", role: attribute, datatype: string, description: "Glennallen Subdistrict, Total Harvest. The sum of state and federal harvest for Glennallen Subdistrict."}
      - {name: "Glennallen_Subdistrict_Harvest_SE", role: attribute, datatype: string, description: "Glennallen Subdistrict, Harvest Standard Error"}
      - {name: "Glennallen_Subdistrict_Harvest_CV", role: attribute, datatype: string, description: "Glennallen Subdistrict, Harvest Coefficient of Variation. Calculated by dividing the Standard Error by the Total Harvest."}
      - {name: "Sport_Harvest", role: attribute, datatype: string, description: "Sport Harvest"}
      - {name: "Sport_SE", role: attribute, datatype: string, description: "Sport Standard Error"}
      - {name: "Sport_CV", role: attribute, datatype: string, description: "Sport Coefficient of Variation. Calculated by dividing the Standard Error by the Total Harvest."}
      - {name: "Inriver_Harvest", role: attribute, datatype: string, description: "Total Inriver Harvest. The sum of Total Harvest for Chitina Subdistrict, Glennallen Subdistrict, and Sport Harvest."}
      - {name: "Total_Harvest", role: attribute, datatype: string, description: "Total Harvest. The sum of Inriver Harvest and Copper District Total Harvest."}
      - {name: "Inriver_Abundance", role: attribute, datatype: string, description: "Inriver Abundance"}
      - {name: "Inriver_SE", role: attribute, datatype: string, description: "Inriver Standard Error"}
      - {name: "Inriver_LCI", role: attribute, datatype: string, description: "Inriver 95% Lower Confidence Interval"}
      - {name: "Inriver_UCI", role: attribute, datatype: string, description: "Inriver 95% Upper Confidence Interval"}
      - {name: "Inriver_CV", role: attribute, datatype: string, description: "Inriver Coefficient of Variation. Calculated by dividing the Standard Error by the Total Inriver Abundance."}
      - {name: "Total_Run", role: attribute, datatype: string, description: "Total Run. The sum of Total Harvest and Total Escapement."}
      - {name: "Harvest_Rate", role: attribute, datatype: string, description: "Harvest Rate. Total Harvest divided by Total Run."}
      - {name: "Total_Escapement", role: attribute, datatype: string, description: "The cumulative total escapement estimate of chinook salmon in Copper River. Abundance minus Inriver Harvest."}
