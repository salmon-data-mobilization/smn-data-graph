title: Fraser River mean discharge at Hope
description: The complete English table has two discharge series for 1912–1999. The annual series averages January–December. The flow-year series runs from April to the following March. Both use cubic metres per second. DFO describes this series as an environmental covariate studied alongside Pacific salmon production.
