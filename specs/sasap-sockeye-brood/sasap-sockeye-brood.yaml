  - id: stock_info
    file: StockInfo.csv
    keys: [Stock.ID]
    columns:
      - {name: "Stock.ID", role: attribute, datatype: string, description: "Stock identifier in this compilation."}
      - {name: "Species", role: attribute, datatype: string, description: "Source species label."}
      - {name: "Stock", role: attribute, datatype: string, description: "Stock name supplied by the source."}
      - {name: "Date.data.obtained", role: attribute, datatype: string, description: "Date the data were obtained. The source uses day 01 when no day was supplied."}
