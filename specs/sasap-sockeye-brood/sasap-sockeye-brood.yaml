spec_version: 1
slug: sasap-sockeye-brood
version: lexical-cr5rr9
title: "Sockeye salmon brood tables, northeastern Pacific, 1922-2016"
description: "[agent] Source catalogue and three complete lexical tables for the SASAP sockeye brood compilation. Each table retains the source columns, records, row order, and cell strings. The EML and processing document identify source definitions and limitations. Brood-table field names alone do not establish comparable escapement measures across stocks."
source:
  publisher: KNB Data Repository
  doi: 10.5063/CR5RR9
  landing_page: https://knb.ecoinformatics.org/view/doi:10.5063/CR5RR9
  licence: null
  redistribution: unconfirmed
  attribution: "Rich Brenner, Greg Ruggerone, Brendan Connors, Jeanette Clark and Stephanie Freund (2017). Sockeye salmon brood tables, northeastern Pacific, 1922-2016. KNB Data Repository. https://doi.org/10.5063/CR5RR9. The EML declares “no restrictions” without a separate licence identifier. This local package adds structural metadata and reserializes the three CSV tables. The analytical code remains supporting evidence."
