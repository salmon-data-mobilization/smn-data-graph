title: Chinook salmon radio-tracking detections from the CTUIR study
description: '[agent] The Confederated Tribes of the Umatilla Indian Reservation collected the radio-tracking data. The complete detection table includes fish identifiers, dates, river positions, body measurements and environmental covariates. The record credits Casey Justice of the Columbia River Inter-Tribal Fish Commission for the water-temperature inputs. Other covariate files, figures and analysis scripts remain in the deposit.'
