name: Source mapping audit
on:
  pull_request:
    paths: ['python/aggregate_coverage.py', 'python/aggregate_coverage.rq', 'tests/test_aggregate_coverage.py', 'specs/source-intake/audit_*.py', 'specs/source-intake/read_numeric_view.py', 'tests/test_source_mapping_audit.py', 'tests/test_measurement_types.py', 'tests/test_mapping_decisions.py', 'tests/test_study_gate.py', 'tests/test_candidate_denominator.py', 'tests/test_schema_projection.py', 'tests/test_scoped_roles.py', '.github/workflows/source-mapping-audit.yml']
  push:
    paths: ['python/aggregate_coverage.py', 'python/aggregate_coverage.rq', 'tests/test_aggregate_coverage.py', 'specs/source-intake/audit_*.py', 'specs/source-intake/read_numeric_view.py', 'tests/test_source_mapping_audit.py', 'tests/test_measurement_types.py', 'tests/test_mapping_decisions.py', 'tests/test_study_gate.py', 'tests/test_candidate_denominator.py', 'tests/test_schema_projection.py', 'tests/test_scoped_roles.py', '.github/workflows/source-mapping-audit.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check stream roles across products, methods, editions and return years
        run: python3 -m unittest discover -s tests -p test_scoped_roles.py
      - name: Check source and projected field availability
        run: python3 -m unittest discover -s tests -p test_schema_projection.py
      - name: Check candidate denominator against outcome classes
        run: python3 -m unittest discover -s tests -p test_candidate_denominator.py
      - name: Check blinded design receipts
        run: python3 -m unittest discover -s tests -p test_study_gate.py
      - name: Check CSV key collisions and join cardinality
        run: python3 -m unittest discover -s tests -p test_source_mapping_audit.py
      - run: python3 -m unittest discover -s tests -p test_measurement_types.py
      - run: python3 -m pip install --target "$RUNNER_TEMP/audit-libs" rdflib==7.6.0
      - name: Check decision registers and independent export scopes
        run: PYTHONPATH="$RUNNER_TEMP/audit-libs" python3 -m unittest discover -s tests -p test_mapping_decisions.py
      - name: Check scoped aggregate coverage with RDFLib
        run: PYTHONPATH="$RUNNER_TEMP/audit-libs" python3 -m unittest discover -s tests -p test_aggregate_coverage.py
