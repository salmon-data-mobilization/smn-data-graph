[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "smn-data-graph"
version = "0.1.0"
description = "Read-only connected discovery over an already admitted local salmon evidence graph"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pyoxigraph==0.5.13"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "rdflib==7.6.0", "pyparsing==3.3.3"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["salmongraph", "salmongraph.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
