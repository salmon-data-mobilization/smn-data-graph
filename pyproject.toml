[project]
name = "salmon-demo-corpus"
version = "0.1.0"
description = "Agent-built corpus of interoperable Pacific salmon datasets for the PICES-2026 demo"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.173",
    "duckdb>=2.0.0",
    "jsonschema>=4.18",
    "metasalmonpy[eml,verify]",
    "openpyxl>=3.1",
    "pyarrow>=17.0",
    "pyoxigraph>=0.5.13",
    "pyshacl>=0.40.1",
    "pyyaml>=6.0",
]

[tool.uv.sources]
metasalmonpy = { url = "https://github.com/salmon-data-mobilization/metasalmonpy/archive/943fe1f50d7ac5b88b8be81250dca2e7aeb0f632.tar.gz" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
